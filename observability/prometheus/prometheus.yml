# OBS-1 Prometheus (docker-compose.observability.yml). Scrape and rule evaluation every 5 s: a counter
# reaches a Grafana panel (refresh 5 s) in about 10 s in the worst case, under the 15 s target.
global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # One static target per replica (not the load balancer): each one has its own `up` series, so a dead
  # replica is `up{job="battle-service", instance="battle-1"} == 0`.
  - job_name: battle-service
    metrics_path: /metrics
    static_configs:
      - targets: ["battle-1:9464"]
        labels:
          instance: battle-1
      - targets: ["battle-2:9464"]
        labels:
          instance: battle-2

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:9082"]
        labels:
          instance: api-gateway

  - job_name: users-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["users-service:9081"]
        labels:
          instance: users-service

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          instance: redis

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          instance: postgres

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance: prometheus
