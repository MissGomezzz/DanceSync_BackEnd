sonar.projectKey=MissGomezzz_DanceSync_BackEnd
sonar.organization=missgomezzz

# Three services in one repository: two Java (Maven) and one TypeScript.
sonar.sources=api-gateway/src/main,users-service/src/main,battle-service/src
sonar.tests=api-gateway/src/test,users-service/src/test,battle-service/test
sonar.java.binaries=api-gateway/target/classes,users-service/target/classes
sonar.java.test.binaries=api-gateway/target/test-classes,users-service/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=api-gateway/target/site/jacoco/jacoco.xml,users-service/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=battle-service/coverage/lcov.info
sonar.coverage.exclusions=battle-service/src/server.ts
# Load-test and measurement scripts are run by hand and never ship in an image.
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,load-tests/**,battle-service/scripts/**
sonar.sourceEncoding=UTF-8

# Rules that do not apply to the Java test sources:
#  - java:S1313 (hard-coded IP): the rate-limit tests need literal client addresses (documentation range 198.51.100.x and private ranges).
#  - java:S2095 (close the HttpClient): HttpClient only became AutoCloseable in Java 21 and the services target Java 17.
sonar.issue.ignore.multicriteria=t1,t2
sonar.issue.ignore.multicriteria.t1.ruleKey=java:S1313
sonar.issue.ignore.multicriteria.t1.resourceKey=**/src/test/**
sonar.issue.ignore.multicriteria.t2.ruleKey=java:S2095
sonar.issue.ignore.multicriteria.t2.resourceKey=**/src/test/**
