server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ORIGIN:http://localhost:5173}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: users-service
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            - id: battle-service-http
              uri: ${BATTLE_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/api/battles/**,/api/rooms/**
            # Socket.IO starts with HTTP long-polling and then upgrades to WebSocket.
            # Keep the http scheme: the gateway switches to ws automatically on Upgrade requests.
            - id: battle-service-ws
              uri: ${BATTLE_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/socket.io/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when_authorized
