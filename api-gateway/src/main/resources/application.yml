server:
  port: ${GATEWAY_PORT:8080}

# battle-service (Express) also sets CORS headers, so HTTP routes dedupe them:
# browsers reject responses carrying the same CORS header twice.
# The filter must NOT run on WebSocket upgrades: their response headers are
# read-only once the handshake is committed and the upgrade would fail.

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ORIGIN:http://localhost:5173}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            # Final match results (HU 21) are read-only through the gateway:
            # battle-service stores them with PUT directly on users-service,
            # so any other method on /api/matches gets a 404 here.
            - id: users-service-matches
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/matches,/api/matches/**
                - Method=GET
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
            - id: users-service
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
            - id: battle-service-http
              uri: ${BATTLE_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/api/battles/**,/api/rooms/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
            # Socket.IO connects with HTTP long-polling and then upgrades to WebSocket.
            # Keep the http scheme: the gateway switches to ws automatically on Upgrade requests.
            # The WebSocket transport is matched first so it skips the dedupe filter.
            - id: battle-service-socket-ws
              uri: ${BATTLE_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/socket.io/**
                - Query=transport, websocket
            - id: battle-service-socket-polling
              uri: ${BATTLE_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/socket.io/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE

# SEG-1, authentication. Registered users present an access token issued by
# Microsoft Entra ID; guests present a token signed by battle-service with
# GUEST_TOKEN_SECRET (the same value in both services). Whatever is left empty
# fails closed: those tokens are refused, never accepted unchecked.
dancesync:
  auth:
    entra:
      tenant-id: ${AZURE_TENANT_ID:}
      # Application (client) id of the API registration: the expected audience.
      client-id: ${AZURE_CLIENT_ID:}
      # Optional, comma separated; defaults to the client id.
      audiences: ${AZURE_API_AUDIENCE:}
      # Optional overrides; derived from the tenant id by default.
      issuer-uri: ${ENTRA_ISSUER_URI:}
      jwk-set-uri: ${ENTRA_JWKS_URI:}
    guest:
      secret: ${GUEST_TOKEN_SECRET:}
    cors:
      allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when_authorized
