server:
  port: ${GATEWAY_PORT:8080}

# battle-service (Express) also sets CORS headers, so HTTP routes dedupe them:
# browsers reject responses carrying the same CORS header twice.
# The filter must NOT run on WebSocket upgrades: their response headers are
# read-only once the handshake is committed and the upgrade would fail.

# OBS-1: one JSON object per line (Elastic Common Schema), the same format as users-service.
# The SEG-1/SEG-3 audit logger keeps its own format (see logback-spring.xml).
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: api-gateway

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # SEG-2 / SEG-3: keep the X-Forwarded-For chain and append the address the gateway sees, so
          # battle-service can tell the client's address. Spring Cloud Gateway keeps only the entries
          # (and the connections) matching this pattern and removes the header otherwise; without it,
          # every client looked like the gateway to battle-service (one SEG-3 block hit everyone and
          # the audit log had no client address). It keeps them all: battle-service and the gateway
          # pick the client's entry by counting TRUSTED_PROXY_HOPS from the right, so whatever a client
          # forges further left is ignored anyway. Narrow it with GATEWAY_TRUSTED_PROXIES if needed.
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:.*}
          # OBS-1: spring_cloud_gateway_requests_seconds, per route and outcome.
          metrics:
            enabled: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ORIGIN:http://localhost:5173}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            # Final match results (HU 21) are read-only through the gateway:
            # battle-service stores them with PUT directly on users-service,
            # so any other method on /api/matches gets a 404 here.
            - id: users-service-matches
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/matches,/api/matches/**
                - Method=GET
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
            # SEG-2: the admin screen (audit log, alerts). Only ROLE_ADMIN gets here (SecurityConfig);
            # InternalTokenRelay adds the internal secret users-service requires on this route only.
            - id: users-service-admin
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/admin,/api/admin/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
            - id: users-service
              uri: ${USERS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
            - id: battle-service-http
              uri: ${BATTLE_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/api/battles/**,/api/rooms/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
            # Socket.IO connects with HTTP long-polling and then upgrades to WebSocket.
            # Keep the http scheme: the gateway switches to ws automatically on Upgrade requests.
            # The WebSocket transport is matched first so it skips the dedupe filter.
            - id: battle-service-socket-ws
              uri: ${BATTLE_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/socket.io/**
                - Query=transport, websocket
            - id: battle-service-socket-polling
              uri: ${BATTLE_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/socket.io/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE

# SEG-1, authentication. Registered users present an access token issued by
# Microsoft Entra ID; guests present a token signed by battle-service with
# GUEST_TOKEN_SECRET (the same value in both services). Whatever is left empty
# fails closed: those tokens are refused, never accepted unchecked.
dancesync:
  auth:
    entra:
      tenant-id: ${AZURE_TENANT_ID:}
      # Application (client) id of the API registration: the expected audience.
      client-id: ${AZURE_CLIENT_ID:}
      # Optional, comma separated; defaults to the client id.
      audiences: ${AZURE_API_AUDIENCE:}
      # Optional overrides; derived from the tenant id by default.
      issuer-uri: ${ENTRA_ISSUER_URI:}
      jwk-set-uri: ${ENTRA_JWKS_URI:}
    guest:
      secret: ${GUEST_TOKEN_SECRET:}
    cors:
      allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    # SEG-2: Entra ID object id (oid) of the single admin account. Empty = nobody is admin.
    admin:
      user-oid: ${ADMIN_USER_OID:}

  # SEG-2, non-repudiation: one audit record per request (user from the token, client address,
  # UTC time, User-Agent, action, outcome, correlation id), delivered in batches to users-service,
  # which adds the region (GeoIP) and chains it. If users-service is down, records wait in a
  # bounded buffer and are retried; requests are never slowed down or refused because of it.
  audit:
    enabled: ${AUDIT_ENABLED:true}
    ingest-url: ${USERS_SERVICE_URL:http://localhost:8081}/internal/audit/events
    # Shared secret of the internal calls (at least 32 bytes, the same in the three services).
    internal-token: ${AUDIT_INTERNAL_TOKEN:}
    flush-interval: ${AUDIT_FLUSH_INTERVAL:PT1S}

  # SEG-3, protection against abuse and denial of service: a token bucket per
  # client address and kind of request, answered 429 with Retry-After when empty.
  # It runs before authentication. With REDIS_URL the buckets are shared by every
  # gateway instance; without it they live in this instance's memory. If Redis
  # fails, requests go through (the limiter never takes the gateway down).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Proxies in front of the gateway (platform ingress, load balancer) whose
    # X-Forwarded-For entry is trusted to find the client's address. 0 = ignore
    # the header, which a client can forge.
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:0}
    redis-url: ${REDIS_URL:}
    # POST /api/rooms: nobody creates more than a few rooms a minute.
    room-create:
      per-second: ${RATE_LIMIT_ROOM_CREATE_PER_SECOND:1}
      burst: ${RATE_LIMIT_ROOM_CREATE_BURST:10}
    # POST /api/rooms/{code}/guest-token: a group joining from one network at once.
    guest-token:
      per-second: ${RATE_LIMIT_GUEST_TOKEN_PER_SECOND:5}
      burst: ${RATE_LIMIT_GUEST_TOKEN_BURST:20}
    # Opening a Socket.IO connection, including the reconnection of a whole room.
    socket-handshake:
      per-second: ${RATE_LIMIT_SOCKET_HANDSHAKE_PER_SECOND:5}
      burst: ${RATE_LIMIT_SOCKET_HANDSHAKE_BURST:30}
    # Requests of an open long-polling session (fallback transport).
    socket-polling:
      per-second: ${RATE_LIMIT_SOCKET_POLLING_PER_SECOND:20}
      burst: ${RATE_LIMIT_SOCKET_POLLING_BURST:40}
    # Any other request (room state, match history, leave beacon...).
    other:
      per-second: ${RATE_LIMIT_OTHER_PER_SECOND:20}
      burst: ${RATE_LIMIT_OTHER_BURST:40}

management:
  # OBS-1: actuator on its own port, scraped by Prometheus inside the network; it is not
  # published and no route leads to it. Prometheus scrapes it without a token
  # (ManagementSecurityConfig), so it exposes health and prometheus only. The API port keeps
  # only GET /actuator/health (ApiPortHealthController); its security rules for /actuator/**
  # are unchanged.
  server:
    port: ${MANAGEMENT_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      service: api-gateway
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
