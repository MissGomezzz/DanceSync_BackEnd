name: Deploy service (reutilizable)

on:
  workflow_call:
    inputs:
      service:
        description: Nombre de la carpeta, de la imagen y de la Container App
        required: true
        type: string
      ref:
        description: Commit to build and deploy (the one CI verified)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/${{ inputs.service }}:${{ inputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login al registro
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Construir y subir la imagen
        run: |
          docker build -t "$IMAGE" ./${{ inputs.service }}
          docker push "$IMAGE"

      - name: Actualizar la Container App
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name ${{ inputs.service }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image "$IMAGE"