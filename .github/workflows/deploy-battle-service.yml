name: Deploy battle-service

on:
  push:
    branches: [deploy/azure]
    paths:
      - 'battle-service/**'
      - '.github/workflows/_deploy-service.yml'
      - '.github/workflows/deploy-battle-service.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: battle-service
    secrets: inherit