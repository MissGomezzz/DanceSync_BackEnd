name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  api-gateway:
    name: API Gateway CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-gateway

    # Redis for the rate limit store tests (SEG-3). Without TEST_REDIS_URL they are skipped.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test and build
        run: ./mvnw -B verify

      # The SonarCloud job (MAN-1) reads this JaCoCo report.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-gateway-coverage
          path: api-gateway/target/site/jacoco/jacoco.xml
          retention-days: 7
          if-no-files-found: warn


  users-service:
    name: Users Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: users-service

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dancesync
          POSTGRES_USER: dancesync
          POSTGRES_PASSWORD: dancesync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dancesync -d dancesync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: dancesync
      POSTGRES_USER: dancesync
      POSTGRES_PASSWORD: dancesync

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test and build
        run: ./mvnw -B verify

      # The SonarCloud job (MAN-1) reads this JaCoCo report.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: users-service-coverage
          path: users-service/target/site/jacoco/jacoco.xml
          retention-days: 7
          if-no-files-found: warn


  battle-service:
    name: Battle Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: battle-service

    # Redis for the shared-state tests (REN-1 / DIS-1): RedisRoomRepository,
    # RedisWordRaceRepository and two instances sharing one Redis. Without
    # TEST_REDIS_URL those tests are skipped.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: battle-service/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Runs the unit tests and measures coverage with c8 (fails below 80 % of lines).
      - name: Run tests with coverage
        run: pnpm test:coverage

      # The SonarCloud job (MAN-1) reads this report.
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: battle-service-coverage
          path: battle-service/coverage/lcov.info
          retention-days: 7

      - name: Build
        run: pnpm build


  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [api-gateway, users-service, battle-service]
    # Secrets are not available to pull requests from forks.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarCloud needs the full history to attribute new code and blame.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The Java analyzer needs the compiled classes.
      - name: Compile the Java services
        run: |
          chmod +x api-gateway/mvnw users-service/mvnw
          (cd api-gateway && ./mvnw -B -DskipTests compile)
          (cd users-service && ./mvnw -B -DskipTests compile)

      - name: Download api-gateway coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: api-gateway-coverage
          path: api-gateway/target/site/jacoco

      - name: Download users-service coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: users-service-coverage
          path: users-service/target/site/jacoco

      - name: Download battle-service coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: battle-service-coverage
          path: battle-service/coverage

      # c8 writes paths relative to battle-service; Sonar needs them relative to the repository root.
      - name: Make the lcov paths relative to the repository
        run: sed -i 's#^SF:#SF:battle-service/#' battle-service/coverage/lcov.info

      # Static analysis (MAN-1). Waits for the Quality Gate and fails the job if it is red.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
