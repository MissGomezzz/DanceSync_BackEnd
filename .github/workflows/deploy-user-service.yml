name: Deploy users-service

on:
  push:
    branches: [main]
    paths:
      - 'users-service/**'
      - '.github/workflows/_deploy-service.yml'
      - '.github/workflows/deploy-user-service.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: users-service
    secrets: inherit