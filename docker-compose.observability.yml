# OBS-1 observability environment (local only, never deployed to Azure): the whole backend behind the
# api-gateway, plus Prometheus, Grafana and the Redis and PostgreSQL exporters.
#
#   docker compose -f docker-compose.observability.yml up -d --build
#
#   API gateway  http://localhost:18080   (the only entry point for clients and load scripts)
#   Grafana      http://localhost:13300   (anonymous viewer; admin password: GRAFANA_ADMIN_PASSWORD)
#   Prometheus   http://localhost:19090   (targets, alert rules, /api/v1/alerts)
#
# Flow: client -> api-gateway -> nginx -> battle-1 | battle-2 (Redis), and api-gateway -> users-service
# (PostgreSQL). Prometheus scrapes each replica on its own address (battle-1:9464, battle-2:9464), so a
# dead replica is a real `up == 0`. Host ports avoid the development ones (3000, 5173, 5432, 6379,
# 8080, 8081): this stack can run next to them.
#
# Every credential below is a LOCAL TEST value (the same fake Entra ID as the load tests,
# load-tests/lib/fake-entra.cjs). Never reuse them outside this machine.
name: obs1

x-auth-env: &auth-env
  AZURE_TENANT_ID: 11111111-1111-4111-8111-111111111111
  AZURE_CLIENT_ID: 22222222-2222-4222-8222-222222222222
  ENTRA_JWKS_URI: http://fake-entra:4010/discovery/v2.0/keys
  GUEST_TOKEN_SECRET: una-clave-de-prueba-de-al-menos-32-caracteres
  # SEG-2: shared secret of the audit batches and of the admin API (local test value).
  AUDIT_INTERNAL_TOKEN: secreto-interno-de-prueba-de-al-menos-32-bytes

x-battle: &battle
  build: ./battle-service
  restart: "no"
  cpus: ${BATTLE_CPUS:-1.0}
  mem_limit: ${BATTLE_MEMORY:-512m}
  environment:
    <<: *auth-env
    PORT: "3000"
    METRICS_PORT: "9464"
    REDIS_URL: redis://redis:6379
    USERS_SERVICE_URL: http://users-service:8081
    AUDIT_INTERNAL_TOKEN: secreto-interno-de-prueba-de-al-menos-32-bytes
    CORS_ORIGIN: http://localhost:5173
    # client (X-Forwarded-For written by the load scripts) -> api-gateway -> nginx -> replica.
    TRUSTED_PROXY_HOPS: "3"
  depends_on:
    redis:
      condition: service_healthy
    fake-entra:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/battles/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dancesync
      POSTGRES_USER: dancesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dancesync}
    # Throwaway data: gone when the container is removed.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dancesync -d dancesync"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    # Volatile state, no persistence. DEBUG is allowed from inside the container only, so that
    # load-tests/scripts/obs-alert-time.mjs can slow Redis down (DEBUG SLEEP) to trigger a latency alert.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--enable-debug-command", "local"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  fake-entra:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "scripts/fake-entra.mjs", "4010"]
    volumes:
      - ./load-tests/scripts:/app/scripts:ro
      - ./load-tests/lib:/app/lib:ro
      # The key pair is created here on first start; the load scripts sign their tokens with it.
      - ./load-tests/.keys:/app/.keys
    # Published only for the frontend's dev login (vite dev, VITE_DEV_LOGIN_URL): POST /dev/token.
    ports:
      - "${OBS_FAKE_ENTRA_PORT:-14010}:4010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/discovery/v2.0/keys').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 10

  users-service:
    build: ./users-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dancesync
      POSTGRES_USER: dancesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dancesync}
      MANAGEMENT_PORT: "9081"
      # SEG-2: audit log. Local test values; the GeoIP database is optional (scripts/download-geoip.sh).
      AUDIT_INTERNAL_TOKEN: secreto-interno-de-prueba-de-al-menos-32-bytes
      AUDIT_CHAIN_KEY: clave-hmac-de-la-cadena-de-prueba-32-bytes
      AUDIT_VERIFY_INTERVAL: PT30S
      GEOIP_DB_PATH: /geoip/dbip-lite.mmdb
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./geoip:/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy

  battle-1:
    <<: *battle

  battle-2:
    <<: *battle

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      battle-1:
        condition: service_healthy
      battle-2:
        condition: service_healthy
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./load-balancer/upstream-2.conf:/etc/nginx/upstream.conf:ro

  api-gateway:
    build: ./api-gateway
    environment:
      <<: *auth-env
      GATEWAY_PORT: "8080"
      MANAGEMENT_PORT: "9082"
      USERS_SERVICE_URL: http://users-service:8081
      BATTLE_SERVICE_URL: http://nginx:80
      FRONTEND_ORIGIN: http://localhost:5173
      REDIS_URL: redis://redis:6379
      # The load scripts play the platform ingress: each room comes from its own X-Forwarded-For address.
      TRUSTED_PROXY_HOPS: "1"
      # SEG-2: the single admin account (the fake Entra user of load-tests/scripts/seg2-verify.mjs).
      ADMIN_USER_OID: ${ADMIN_USER_OID:-00000000-0000-4000-8000-00000000ad01}
    depends_on:
      nginx:
        condition: service_started
      users-service:
        condition: service_started
    ports:
      - "${OBS_GATEWAY_PORT:-18080}:8080"

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      # The credentials travel as separate variables, not inside a connection URL.
      DATA_SOURCE_URI: postgres:5432/dancesync?sslmode=disable
      DATA_SOURCE_USER: dancesync
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-dancesync}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${OBS_PROMETHEUS_PORT:-19090}:9090"

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      # Local only. The default is a documented non-secret value for this machine; set
      # GRAFANA_ADMIN_PASSWORD in the shell to use another one. Viewing needs no sign-in.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-obs1-local-only}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dancesync-technical.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "${OBS_GRAFANA_PORT:-13300}:3000"

volumes:
  prometheus-data:
