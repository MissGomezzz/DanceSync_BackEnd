# Balanceador de DanceSync en Azure Container Apps (REN-1 / DIS-1).
# Reparte las conexiones entre battle-service-a y battle-service-b con least_conn.
# Cada réplica es su propia Container App con ingreso TCP interno: Azure solo pasa bytes,
# la decisión de a qué réplica va cada conexión la toma este nginx.
worker_processes auto;

events {
  # Cada WebSocket ocupa dos conexiones (cliente y réplica).
  worker_connections 16384;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Qué réplica atendió cada petición, según el puerto TCP de su app (3001 = a, 3002 = b).
  # Si hubo reintento, $upstream_addr lista los dos intentos; cuenta el último.
  map $upstream_addr $replica {
    ~:3001$ battle-service-a;
    ~:3002$ battle-service-b;
    default none;
  }

  # Una línea JSON por petición: se consulta en Log Analytics (ContainerAppConsoleLogs_CL).
  log_format lb escape=json '{"event":"lb.request","time":"$time_iso8601","request":"$request",'
                            '"status":$status,"replica":"$replica","upstream":"$upstream_addr",'
                            '"upstreamStatus":"$upstream_status","duration":$request_time}';
  access_log /dev/stdout lb;

  upstream battle {
    # La conexión nueva va a la réplica con menos conexiones abiertas (las WebSocket duran minutos).
    least_conn;
    # Compartido por todos los workers: un solo conteo de conexiones y un solo estado de falla.
    zone battle 64k;
    # DIS-1, verificación pasiva: un intento fallido saca la réplica 10 s y la petición se reintenta en la otra.
    server battle-service-a:3001 max_fails=1 fail_timeout=10s;
    server battle-service-b:3002 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 80;

    # Sonda de salud de la propia app load-balancer.
    location = /lb-health {
      access_log off;
      return 200 "ok\n";
    }

    # Conexiones activas del balanceador (solo dentro del entorno: el ingreso es interno).
    location = /lb-status {
      access_log off;
      stub_status;
    }

    location / {
      proxy_pass http://battle;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      # Una conexión de batalla dura minutos: sin cortes por inactividad.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      # Recuperación rápida (DIS-1): 2 s para conectar y, si falla, un intento más en la otra réplica.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 5s;
    }
  }
}
