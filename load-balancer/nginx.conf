# Balanceador del prototipo local (REN-1 / DIS-1). Equivale al ingreso de Azure Container Apps.
# Los clientes se conectan solo por WebSocket (ADR-02): no hace falta afinidad de sesión,
# cualquier réplica atiende cualquier conexión porque el estado vive en Redis.
worker_processes auto;

events {
  # Cada WebSocket ocupa dos conexiones (cliente y réplica).
  worker_connections 16384;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Qué réplica atendió cada conexión: evidencia del reparto.
  log_format lb '$time_iso8601 "$request" status=$status upstream=$upstream_addr duration=$request_time';
  access_log /dev/stdout lb;

  # upstream-1.conf (una réplica recibe tráfico) o upstream-2.conf (dos), según LB_REPLICAS.
  include /etc/nginx/upstream.conf;

  server {
    listen 80;

    location = /lb-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://battle;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      # Una conexión de batalla dura minutos: sin cortes por inactividad.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      # Verificación de salud pasiva (nginx de código abierto): si una réplica falla, el siguiente intento va a otra.
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
