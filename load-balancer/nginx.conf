# Balanceador del prototipo local (REN-1 / DIS-1). Equivale al ingreso de Azure Container Apps.
# Los clientes se conectan solo por WebSocket (ADR-02): no hace falta afinidad de sesión,
# cualquier réplica atiende cualquier conexión porque el estado vive en Redis.
worker_processes auto;

events {
  # Cada WebSocket ocupa dos conexiones (cliente y réplica).
  worker_connections 16384;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Qué réplica atendió cada conexión: evidencia del reparto.
  log_format lb '$time_iso8601 "$request" status=$status upstream=$upstream_addr duration=$request_time';
  access_log /dev/stdout lb;

  # upstream-1.conf (una réplica recibe tráfico) o upstream-2.conf (dos), según LB_REPLICAS.
  include /etc/nginx/upstream.conf;

  server {
    listen 80;

    location = /lb-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://battle;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      # Una conexión de batalla dura minutos: sin cortes por inactividad.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      # Verificación de salud pasiva (nginx de código abierto): si una réplica falla, el siguiente intento va a otra.
      proxy_next_upstream error timeout http_502 http_503;
      # DIS-1 fast failover. A killed replica refuses connections (or, once its container is gone, never
      # answers the TCP handshake): give up after 2 s and try the other replica, at most once more.
      # nginx OSS has no active health checks: a crashed replica is detected by the first request that
      # fails on it (and kept out for fail_timeout), while a replica that hangs but still accepts
      # connections is only noticed through client heartbeats (Socket.IO ping) here. In Azure Container
      # Apps the readiness probe on /api/battles/health/ready removes such a replica actively.
      proxy_connect_timeout 2s;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 5s;
    }
  }
}
