# Dos réplicas: el tráfico va a la que tenga menos conexiones abiertas (las de WebSocket duran minutos).
upstream battle {
  least_conn;
  # Shared by every nginx worker: without it each worker keeps its own connection counts and failure
  # state, so least_conn balances per worker and each worker must discover a dead replica on its own.
  zone battle 64k;
  # DIS-1 passive health check: a single failed attempt (connection refused, no answer within
  # proxy_connect_timeout, 502/503) marks the replica down for 10 s; the request that failed is
  # retried on the other replica (proxy_next_upstream), so a crashed replica costs no request.
  server battle-1:3000 max_fails=1 fail_timeout=10s;
  server battle-2:3000 max_fails=1 fail_timeout=10s;
}
