# Una sola réplica recibe tráfico (línea base del estrés). battle-2 sigue arriba pero sin conexiones.
upstream battle {
  # Shared by every nginx worker: without it each worker keeps its own connection counts and failure
  # state, so least_conn balances per worker and each worker must discover a dead replica on its own.
  zone battle 64k;
  # DIS-1: one failed attempt takes the replica out for 10 s (see upstream-2.conf).
  server battle-1:3000 max_fails=1 fail_timeout=10s;
}
